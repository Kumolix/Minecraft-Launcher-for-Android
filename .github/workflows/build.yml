name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: Build native libraries (arm64)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          echo "NDK: $NDK"
          test -x "$CC"
          OUT=app/src/main/jniLibs/arm64-v8a
          mkdir -p "$OUT"
          "$CC" -shared -fPIC -O2 -o "$OUT/libnotag.so" native/notag.c
          "$CC" -shared -fPIC -O2 -o "$OUT/libsimplemc.so" native/simplemc.c -llog -landroid -lEGL -lGLESv2 -ldl

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Name the APK
        run: |
          NAME="SimpleMC-launcher-v-$(cat VERSION)"
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/$NAME.apk"
          echo "NAME=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.NAME }}
          path: out/*.apk
